<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>lazarusli · Social Journal (ISSN 2718-1919)</title>
  <meta name="description" content="lazarusli — a satire journal-style landing page for a social media scholar. ISSN 2718-1919." />

  <style>
    :root{
      --bg:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --border:#e2e8f0;
      --card:#ffffff;
      --brand:#0b5ed7;
      --brand2:#0ea5e9;
      --soft:#f1f5f9;
      --shadow: 0 10px 30px rgba(2,6,23,.08);
      --radius: 18px;
      --max: 1120px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",
                   "Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
    }
    a{color:inherit}
    .wrap{max-width:var(--max); margin:0 auto; padding:0 18px;}

    /* Top bar */
    .topbar{
      position:sticky; top:0; z-index:40;
      background: rgba(255,255,255,.90);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 0;
      gap:16px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      text-decoration:none;
      min-width: 220px;
    }
    .logo{
      width:38px; height:38px; border-radius:12px;
      background: radial-gradient(circle at 20% 20%, var(--brand2), var(--brand));
      box-shadow: 0 8px 20px rgba(14,165,233,.25);
      position: relative;
      overflow: hidden;
    }
    /* tiny “S” slash vibe without text */
    .logo:after{
      content:"";
      position:absolute; inset:-10px;
      background: linear-gradient(135deg, rgba(255,255,255,.0), rgba(255,255,255,.65), rgba(255,255,255,0));
      transform: rotate(25deg);
      opacity:.5;
    }

    .brand strong{font-size:18px; letter-spacing:.2px}
    .brand small{display:block; color:var(--muted); font-size:12px; margin-top:-2px}

    .nav{
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      color:var(--muted);
      font-size:14px;
    }
